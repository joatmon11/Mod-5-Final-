<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MovieSearch</title>
    <link rel="stylesheet" href="style.css" />
    <script src="app.js" defer></script>
    <script src="https://kit.fontawesome.com/4c9615f273.js" crossorigin="anonymous"></script>
  </head>
  <body>
    <section id="header">
      <img class="overlay" src="assets/view-3d-cinema-theatre-room.jpg" alt="overlay">
        <nav class="nav__bar">
          <div class="logo__cont">
            <img class="logo" src="assets/nikin-play-8681108.png" alt="Logo" />
            <h2 class="logo__name">MovieSearch</h2>
          </div>
          <div class="nav__links">
            <a href="" class="link">Home</a>
            <a href="" class="link">Find your movie</a>
            <a href="" class="link">Contact</a>
          </div>
        </nav>
        <div class="hero">
          <h1 class="main__title">Browse our movies</h1>
          <div class="search__wrapper">
            <input class="search__box" type="text" placeholder="Search by Catagory or Keyword"/>
            <div class="search__logo">
              <a href="#">
                <i class="fa-solid fa-magnifying-glass"></i>
              </a>
            </div>
          </div>
        </div>
    </section>
    <section id="search">
      <div class="progress-bar"></div>
      <div class="filter__wrapper">
        <div class="filter__title"><b>Search results:</b></div>
        <div class="price__filter--wrapper">
          <h2>Year range: <b id="min-value">1980</b> to <b id="max-value">2026</b></h2>
          <div class="slide__container">
            <div class="range__fill"></div>
            <input
              type="range"
              min="1980"
              max="2026"
              value="1980"
              class="min-value"
              id="myRange"
            />
            <input
              type="range"
              min="1980"
              max="2026"
              value="2026"
              class="max-value"
              id="myRange2"
            />
          </div>
        </div>
      </div>
    </section>
    <section id="results">
      <div class="container results__container">
        <div class="movie__wrapper">
          <div class="movie__card">
            <div class="movie__poster">
            <img class="poster__img" src="assets/missing.jpg" alt="Movie Poster">
            </div>
            <div class="movie__info">
              <h3 class="movie__title">TITLE</h3>
              <p class="movie__year">YEAR</p>
              <p class="movie__rating">RATING</p>
              <div class="movie__plot">PLOT
                <p class="plot__para">Blah, blah, blah</p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </body>
  <footer>Footer section</footer>
</html>
