<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MovieSearch</title>
    <link rel="stylesheet" href="style.css" />
    <script src="app.js" defer></script>
    <script src="https://kit.fontawesome.com/4c9615f273.js" crossorigin="anonymous"></script>
  </head>
  <body>
    <section id="header">
      <img class="overlay" src="assets/view-3d-cinema-theatre-room.jpg" alt="overlay">
        <nav class="nav__bar">
          <div class="logo__cont">
            <img class="logo" src="assets/nikin-play-8681108.png" alt="Logo" />
            <h2 class="logo__name">MovieSearch</h2>
          </div>
          <div class="nav__links">
            <a href="" class="link">Home</a>
            <a href="" class="link">Find your movie</a>
            <a href="" class="link">Contact</a>
          </div>
        </nav>
        <div class="hero">
          <h1 class="main__title">Browse our movies</h1>
          <div class="search__wrapper">
            <input class="search__box" type="text" placeholder="Enter a keyword" id="keyword"/>
            <div class="search__logo" onclick="fetchMovies()">
              <a href="#" id="search-btn">
                <i class="fa-solid fa-magnifying-glass"></i>
              </a>
            </div>
          </div>
        </div>
    </section>
    <section id="search">
      <div class="progress-bar"></div>
      <div class="filter__wrapper">
        <div class="filter__title"><b>Search results:</b></div>
        <div class="price__filter--wrapper">
          <h2>Year range: <b id="min-value">1960</b> to <b id="max-value">2026</b></h2>
          <div class="slide__container">
            <div class="range__fill"></div>
            <input
              type="range"
              min="1960"
              max="2026"
              value="1960"
              class="min-value"
              id="myRange"
            />
            <input
              type="range"
              min="1960"
              max="2026"
              value="2026"
              class="max-value"
              id="myRange2"
            />
          </div>
        </div>
      </div>
    </section>
    <section id="results">
      <div class="container results__container">
        <div class="movie__wrapper">
          <div class="launcher">
            <h1 class="results__title">Search to launch results!</h1>
            <img class="launch__img" src="assets/rocket.svg" alt="">
          </div>
        </div>
      </div>
    </section>
  </body>
  <footer>Copyright © 2026 JoatJeffCreations. All rights reserved.</footer>
</html>
