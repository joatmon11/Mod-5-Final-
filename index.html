<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MovieSearch</title>
    <link rel="stylesheet" href="style.css" />
    <script src="app.js" defer></script>
    <script src="https://kit.fontawesome.com/4c9615f273.js" crossorigin="anonymous"></script>
  </head>
  <body>
    <section id="header">
      <img class="overlay" src="assets/view-3d-cinema-theatre-room.jpg" alt="overlay">
        <nav class="nav__bar">
          <div class="logo__cont">
            <img class="logo" src="assets/nikin-play-8681108.png" alt="Logo" />
            <h2 class="logo__name">Movie Search</h2>
          </div>
          <div class="nav__links">
            <a href="" class="link">Home</a>
            <a href="" class="link">Find your movie</a>
            <a href="" class="link">Contact</a>
          </div>
        </nav>
        <div class="hero">
          <h1 class="main__title">Browse our movies</h1>
          <div class="search__wrapper">
            <input
              class="search__box"
              type="text"
              placeholder="  Search by Catagory or Keyword"
            />
            <div class="search__logo">
              <a href="#">
                <i class="fa-solid fa-magnifying-glass"></i>
              </a>
            </div>
          </div>
        </div>
    </section>
    <section id="search">
      <div class="progress-bar"></div>
      <div class="filter__wrapper">
        <div class="filter__title"><b>Search results:</b></div>
        <div class="price__filter--wrapper">
          <h2>Price range: <br><b id="min-value">$0</b> to <b id="max-value">$100,000</b></h2>
          <div class="slide__container">
            <div class="range__fill"></div>
            <input
              type="range"
              min="1"
              max="100000"
              value="1"
              class="min-value"
              id="myRange"
            />
            <input
              type="range"
              min="1"
              max="100000"
              value="100000"
              class="max-value"
              id="myRange2"
            />
          </div>
        </div>
      </div>
    </section>
  </body>
  <footer>Footer section</footer>
</html>
